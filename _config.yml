title: kanata 的小窝
subtitle: 记录学习，也记录喜欢的事物
description: 课程笔记 · 技术记录 · 日常碎片
author: kanata-0527
language: zh-CN
timezone: Asia/Shanghai
url: https://kanata-0527.github.io
root: /
permalink: notes/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render:
  - assets/**
  - downloads/**
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: null
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
  exclude_languages:
    - mermaid
prismjs:
  enable: false
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - '@traptitech/markdown-it-katex'
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: 未分类
category_map: {}
tag_map: {}
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
include: []
exclude: []
ignore: []
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false
theme: particlex
deploy: {}
